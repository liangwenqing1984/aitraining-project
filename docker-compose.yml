version: '3.8'

services:
  # ==================== PostgreSQL 16 + pgvector ====================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aitrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: liangwenqing
      POSTGRES_PASSWORD: liangwenqing
      POSTGRES_DB: training_exercises
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动建 schema + 启用 vector 扩展
      - ./code/backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liangwenqing -d training_exercises"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: aitrain-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass pwd
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "pwd", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 后端 API 服务 ====================
  backend:
    build:
      context: ./code/backend
      dockerfile: Dockerfile
    container_name: aitrain-backend
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      PORT: "3004"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: liangwenqing
      DB_PASSWORD: liangwenqing
      DB_NAME: training_exercises
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: pwd
      CHROME_PATH: /usr/bin/chromium
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==================== 前端 ====================
  frontend:
    build:
      context: ./code/frontend
      dockerfile: Dockerfile
    container_name: aitrain-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_TARGET: http://backend:3004
    depends_on:
      - backend

volumes:
  pgdata:
  backend_data:
