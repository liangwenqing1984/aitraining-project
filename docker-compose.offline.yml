# ============================================================================
# 离线部署 docker compose 配置
# 使用前需先在联网机器上构建并导出镜像，然后拷贝到离线机器加载：
#   联网机：docker compose build
#   联网机：docker save -o aitrain-images.tar aitrain-base:latest aitrain-backend:latest ...
#   离线机：docker load -i aitrain-images.tar
#   离线机：docker compose -f docker-compose.offline.yml up -d
# ============================================================================

services:
  # ==================== PostgreSQL 17 + pgvector ====================
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pgvector-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: liangwenqing
      POSTGRES_PASSWORD: liangwenqing
      POSTGRES_DB: training_exercises
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./code/backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liangwenqing -d training_exercises"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: aitrain-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass pwd
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "pwd", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== IP 代理池 ====================
  proxy-pool:
    image: aitrain-proxy-pool:latest
    container_name: aitrain-proxy-pool
    restart: unless-stopped
    ports:
      - "5010:5010"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: pwd
      REDIS_DB: "1"
    volumes:
      # 挂载代理池源码，添加自定义 Getter 后 docker restart 即可，无需重建镜像
      - ./code/proxy-pool/repo:/app
    depends_on:
      redis:
        condition: service_healthy

  # ==================== ML 训练容器 ====================
  trainer:
    image: aitrain-trainer:latest
    container_name: aitrain-trainer
    restart: unless-stopped
    volumes:
      - ./code/backend/data:/app/data
      - ./code/backend/scripts:/scripts:ro
    environment:
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_ENABLE_HF_XET: "0"

  # ==================== 后端 API 服务 ====================
  backend:
    image: aitrain-backend:latest
    container_name: aitrain-backend
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      PORT: "3004"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: liangwenqing
      DB_PASSWORD: liangwenqing
      DB_NAME: training_exercises
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: pwd
      CHROME_PATH: /usr/bin/chromium
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000,http://localhost:3002,http://127.0.0.1:3000}"
      TRAINER_CONTAINER: aitrain-trainer
      PROXY_POOL_URL: http://proxy-pool:5010
    volumes:
      # 挂载源码，修改后 docker restart aitrain-backend 即可生效（镜像需用 dev 模式构建）
      - ./code/backend/src:/app/src
      - ./code/backend/scripts:/app/scripts
      - ./code/backend/chrome-path.js:/app/chrome-path.js
      - ./code/backend/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    # 开发模式：tsx watch 热重载（需镜像构建时 NODE_ENV=development）
    command: if [ "${NODE_ENV:-production}" = "development" ]; then npx tsx watch src/index.ts; else node dist/index.js; fi
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==================== 前端 ====================
  frontend:
    image: aitrain-frontend:latest
    container_name: aitrain-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_TARGET: http://backend:3004
    volumes:
      # 挂载源码，修改后 docker restart aitrain-frontend 即可，无需重建镜像
      - ./code/frontend/src:/app/src
      - ./code/frontend/index.html:/app/index.html
      - ./code/frontend/vite.config.ts:/app/vite.config.ts
      - ./code/frontend/tsconfig.json:/app/tsconfig.json
    depends_on:
      - backend

volumes:
  pgdata:
